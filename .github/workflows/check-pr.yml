name: Check PR for merging

on:
  pull_request:

concurrency:
  group: pr-allowed-to-merge-${{ github.ref_name }}
  cancel-in-progress: true
   
jobs:
  native-platforms:
    name: Native resolution on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --experimental-import-meta-resolve
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check freezer package resolution
        run: node lively.freezer/tests/package-resolution-test.cjs
      - name: Check dynamic import paths
        run: node lively.freezer/tests/dynamic-system-import-test.mjs
      - name: Check project bundles
        run: node lively.freezer/tests/project-bundle-test.mjs
      - name: Check native resolver
        run: node lively.modules/tests/native-resolver-test.mjs
      - name: Check live SystemJS resolution
        run: node --trace-uncaught lively.modules/tests/native-system-live-test.mjs
      - name: Check desktop downloads
        run: node lively.app/scripts/test-downloads.mjs
      - name: Check desktop dependency junctions
        run: node lively.app/scripts/test-windows-dependency-layout.mjs
      - name: Check packaged Unix payload
        if: runner.os == 'macOS'
        run: node lively.app/scripts/test-package-payload.mjs

  tests:
    name: Check if `lively.next` world loads and tests stay green
    runs-on: ubuntu-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-wasip1
      - name: Install `sultan`
        run: pip3 install sultan 
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache `lively.next` dependencies
        id: cache-lively-deps
        uses: actions/cache/restore@v3
        env:
          cache-name: lively-deps
        with:
          path: | 
            ~/.bun/install/cache/
            .puppeteer-browser-cache/
          key: ${{ runner.os }}-${{ runner.arch }}-node24-bun1.4.2-${{ hashFiles('bun.lock', 'bunfig.toml') }}
      - name: Verify fresh frozen install
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/lively-empty-bun-cache
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.puppeteer-browser-cache
        run: |
          test -f bun.lock
          rm -rf node_modules
          bun install --frozen-lockfile
      - name: Prepare to install `lively.next`
        run: chmod a+x ./install.sh
      - name: Install `lively.next`
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_on: error
          command: ./install.sh --no-desktop
      - name: Cache `lively.next` dependencies
        if: ${{ steps.cache-lively-deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v3
        env:
          cache-name: lively-deps
        with:
          path: |
            ~/.bun/install/cache/
            .puppeteer-browser-cache/           
          key: ${{ runner.os }}-${{ runner.arch }}-node24-bun1.4.2-${{ hashFiles('bun.lock', 'bunfig.toml') }}
      - name: Run migration regression tests
        run: |
          export BUN_PATH="$(command -v bun)"
          node --experimental-import-meta-resolve lively.modules/tests/native-resolver-test.mjs
          node --experimental-import-meta-resolve lively.modules/tests/native-system-live-test.mjs
          node --experimental-import-meta-resolve lively.freezer/tests/package-resolution-test.cjs
          node --experimental-import-meta-resolve lively.freezer/tests/dynamic-system-import-test.mjs
          node --experimental-import-meta-resolve lively.freezer/tests/swc-state-test.mjs
          node --experimental-import-meta-resolve lively.freezer/tests/minify-test.cjs
          node --experimental-import-meta-resolve lively.freezer/tests/project-bundle-test.mjs
          node --experimental-import-meta-resolve lively.server/tests/browser-import-map-cache-test.mjs
          node --experimental-import-meta-resolve lively.project/tests/package-install-test.mjs
          node --experimental-import-meta-resolve lively.installer/tests/runtime-roots-test.mjs
          node lively.morphic/tests/rollup-build-test.cjs
          node --experimental-import-meta-resolve lively.app/scripts/test-package-payload.mjs
          node --experimental-import-meta-resolve lively.app/scripts/test-downloads.mjs
      - name: Run CI Test Script for Changed Folders
        run:  ./scripts/test.sh $(./scripts/tests_for_branch.sh)
      - name: Start the lively server
        run: |
          chmod a+x ./start-server.sh
          for attempt in 1 2 3; do
            ./start-server.sh > /tmp/lively-next-boot-server.log 2>&1 &
            server_pid=$!
            if node ./scripts/wait-for-server.js http://127.0.0.1:9011/ 120000 1000 "$server_pid"; then
              exit 0
            fi
            echo "Lively server boot-check start attempt $attempt/3 failed. Recent server output:"
            tail -80 /tmp/lively-next-boot-server.log 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            pkill -f "bin/start-server.js.*9011" 2>/dev/null || true
            pkill -f "start-server.sh" 2>/dev/null || true
          done
          exit 1
      - name: Run boot check script
        run: |
          chmod a+x ./scripts/check-boot.sh
          ./scripts/check-boot.sh
