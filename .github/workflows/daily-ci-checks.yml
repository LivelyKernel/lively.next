name: Daily `lively.next` Status Check

on:
  schedule:
    - cron: "0 0 * * MON-FRI"
  workflow_dispatch:

concurrency:
  group: health-check-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Setup `node`
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-wasip1
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache `lively.next` dependencies
        id: cache-lively-deps
        uses: actions/cache/restore@v3
        env:
          cache-name: lively-deps
        with:
          path: |
            ~/.bun/install/cache/
            .puppeteer-browser-cache/          
          key: ${{ runner.os }}-${{ runner.arch }}-node24-bun1.4.2-${{ hashFiles('bun.lock', 'bunfig.toml') }}
      - name: Prepare to install `lively.next`
        run: |
          chmod a+x ./install.sh
      - name: Install `lively.next`
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_on: error
          command: ./install.sh
      - name: Cache `lively.next` dependencies
        if: ${{ steps.cache-lively-deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v3
        env:
          cache-name: lively-deps
        with:
          path: |
            ~/.bun/install/cache/
            .puppeteer-browser-cache/           
          key: ${{ runner.os }}-${{ runner.arch }}-node24-bun1.4.2-${{ hashFiles('bun.lock', 'bunfig.toml') }}
      - name: Verify locks are unchanged
        run: >-
          git diff --exit-code --
          package.json bun.lock bunfig.toml
          */package.json
          lively.installer/assets/partsbin-seed/package.json
          lively.installer/assets/partsbin-seed/bun.lock
      - name: Run CI Test Script
        run:  ./scripts/test.sh
      - name: Circumvent buggy behavior of GHA Job Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_output
          path: test_output_clean.md
          retention-days: 1
  cold-install:
    name: Cold frozen install, build, and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure private caches
        run: |
          echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/lively-bun-cache" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/lively-xdg-cache" >> "$GITHUB_ENV"
          echo "JSPM_CACHE_DIR=$RUNNER_TEMP/lively-jspm-cache" >> "$GITHUB_ENV"
          echo "PUPPETEER_CACHE_DIR=$RUNNER_TEMP/lively-puppeteer-cache" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-wasip1
      - name: Install and build without shared caches
        run: |
          test -f bun.lock
          chmod +x ./install.sh
          CI=true ./install.sh --no-desktop
      - name: Verify locks are unchanged
        run: >-
          git diff --exit-code --
          package.json bun.lock bunfig.toml
          */package.json
          lively.installer/assets/partsbin-seed/package.json
          lively.installer/assets/partsbin-seed/bun.lock
      - name: Run migration regression tests
        run: |
          export BUN_PATH="$(command -v bun)"
          node --experimental-import-meta-resolve lively.modules/tests/native-resolver-test.mjs
          node --experimental-import-meta-resolve lively.modules/tests/native-system-live-test.mjs
          node --experimental-import-meta-resolve lively.freezer/tests/package-resolution-test.cjs
          node --experimental-import-meta-resolve lively.freezer/tests/dynamic-system-import-test.mjs
          node --experimental-import-meta-resolve lively.freezer/tests/swc-state-test.mjs
          node --experimental-import-meta-resolve lively.freezer/tests/minify-test.cjs
          node --experimental-import-meta-resolve lively.freezer/tests/project-bundle-test.mjs
          node --experimental-import-meta-resolve lively.server/tests/browser-import-map-cache-test.mjs
          node --experimental-import-meta-resolve lively.project/tests/package-install-test.mjs
          node --experimental-import-meta-resolve lively.installer/tests/runtime-roots-test.mjs
          cd lively.lang
          node --experimental-import-meta-resolve ../mocha-es6/bin/mocha-es6.js tests/string-test.js
      - name: Run strict browser boot smoke
        run: |
          chmod +x ./start-server.sh ./scripts/check-boot.sh
          ./start-server.sh 9021 > /tmp/lively-next-cold-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            pkill -TERM -P "$server_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          node ./scripts/wait-for-server.js http://127.0.0.1:9021/ 120000 1000 "$server_pid"
          LIVELY_BOOT_URL=http://127.0.0.1:9021 ./scripts/check-boot.sh

  docs-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup `node`
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked tooling
        env:
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.puppeteer-browser-cache
        run: |
          test -f bun.lock
          bun install --frozen-lockfile
      - name: Setup GitHub Action Summary
        run: |
          echo '' >> docs_output.md
          echo '---' >> docs_output.md
          echo '# Status of Documentation <g-emoji class="g-emoji" alias="books" fallback-src="https://github.githubassets.com/images/icons/emoji/unicode/1f4da.png"><img class="emoji" alt="books" src="https://github.githubassets.com/images/icons/emoji/unicode/1f4da.png" width="20" height="20"></g-emoji>' >> docs_output.md
      - name: Lint Code and Summarize Number of Errors
        run: ./node_modules/.bin/eslint -c .eslintrc.js lively.*/*.js | grep '✖' >> docs_output.md
      - name: Circumvent buggy behavior of GHA Job Summaries
        uses: actions/upload-artifact@v4
        with:
          name: docs_output
          path: docs_output.md
          retention-days: 1
  summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [docs-coverage, tests]
    steps:
      - name: Download Test Output Artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
          name: test_output
      - name: Download Docs Output Artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
          name: docs_output
      - name: Assemble Summary
        run: |
          cat test_output_clean.md >> $GITHUB_STEP_SUMMARY
          cat docs_output.md >> $GITHUB_STEP_SUMMARY
      - name: Delete all Artifacts
        uses: geekyeggo/delete-artifact@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: |
            docs_output
            test_output
